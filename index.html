<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
  // a cabeça só carrega (three + modelo) quando a seção chega perto da tela: a abertura não espera o 3D
  const caixa = document.querySelector("#abordagem .cabeca");
  if (caixa) {
    const io = new IntersectionObserver(async ([e]) => {
      if (!e.isIntersecting) return;
      io.disconnect();
      (await import("./js/ascii-head.js")).montar(caixa);
    }, { rootMargin: "600px 0px" });
    io.observe(caixa);
  }
</script>
